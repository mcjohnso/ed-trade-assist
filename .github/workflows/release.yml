# Copy to .github/workflows/release.yml
# On a pushed version tag (e.g. v1.2.0) this builds the plugin zip and publishes
# a GitHub Release with it attached. Requires package.py at the repo root.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build plugin zip
        run: python package.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
